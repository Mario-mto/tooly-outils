* { box-sizing: border-box; }
body { margin: 0; font-family: "Lexend", system-ui, sans-serif; font-size: 16px; background: var(--fond); color: var(--encre); min-height: 100vh; overflow-x: hidden; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; }
h1, h2, h3 { font-family: "FatFrank", "Lexend", system-ui, sans-serif; font-weight: 800; margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.decor { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.orbe { position: absolute; width: 900px; height: 900px; max-width: none; border-radius: 50%; left: -280px; top: 60px; background: var(--orbe); animation: derive 14s ease-in-out infinite; }
.orbe2 { position: absolute; width: 420px; height: 420px; border-radius: 50%; right: -120px; bottom: -140px; background: var(--orbe2); }

#ecran { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding-block: 28px 140px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ecran { animation: monte .45s ease-out; }

.lead { font-size: 18px; line-height: 1.6; color: var(--texte); font-weight: 300; max-width: 62ch; }
.tag { display: inline-block; width: fit-content; background: var(--rose); color: var(--prune); font-family: "FatFrank", sans-serif; font-size: 14px; padding: 4px 12px; border-radius: 999px; }
.tag.clair { background: var(--fond); color: var(--sarcelle-f); }
.pill { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--fond2); color: var(--sarcelle-f); }
.pill.a-revoir { background: var(--creme); color: var(--creme-txt); }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 999px; font-weight: 600; font-size: 16px; transition: transform .15s; }
.btn:hover { transform: translateY(-2px); }
.btn.main { background: var(--sombre); color: var(--sombre-txt); }
.btn.jaune { background: var(--jaune); color: #1D2124; }
.suite { margin-top: 4px; }
.reflechit { display: flex; gap: 12px; align-items: center; color: var(--discret); font-size: 15px; padding: 8px 4px; }
.points span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--sarcelle); margin-right: 4px; animation: clignote 1s infinite; }
.points span:nth-child(2) { animation-delay: .15s; } .points span:nth-child(3) { animation-delay: .3s; }

.carte { background: var(--surface); border-radius: 32px; padding: 28px 30px; box-shadow: var(--ombre); display: grid; gap: 14px; min-width: 0; }
.carte h2 { font-size: 26px; line-height: 1.15; }
.carte h3 { font-size: 20px; }
.carte p { font-size: 15px; line-height: 1.55; color: var(--texte); }
.sub { color: var(--discret); font-size: 14px; }
.crit { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.crit div { background: var(--fond2); border-radius: 18px; padding: 12px 14px; }
.crit b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; color: var(--sarcelle); }
.crit span { font-size: 15px; line-height: 1.35; }
.verdict-tache { justify-self: start; background: var(--fond); color: var(--sarcelle-f); font-weight: 600; font-size: 14px; padding: 6px 14px; border-radius: 999px; }

.opts { display: grid; gap: 10px; }
.opt { text-align: left; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; border: 2px solid transparent; background: var(--fond2); transition: transform .15s, background .2s, border-color .2s; }
.opt:hover:not([disabled]) { transform: translateX(4px); border-color: var(--aqua); }
.opt[disabled] { cursor: default; }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: var(--surface); }
.opt .reco { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--sarcelle-f); background: var(--fond); padding: 3px 10px; border-radius: 999px; }
.opt.choisie { border-color: var(--sarcelle); background: var(--fond); }
.choix.fini .opt:not(.choisie), .quiz.fini .opt:not(.bonne):not(.fausse) { opacity: .55; }

.quiz { background: var(--sombre); color: var(--sombre-txt); }
.quiz h2 { font-size: 28px; }
.quiz .opt { background: var(--sombre-opt); }
.quiz .opt .k { background: var(--sombre-k); }
.quiz .opt.bonne { background: #086F70; border-color: #6AD9D9; color: #fff; }
.quiz .opt.bonne .k { background: #6AD9D9; color: #005555; }
.quiz .opt.fausse { background: #812418; border-color: #FF9082; color: #fff; }
.quiz .opt.fausse .k { background: #FF9082; color: #812418; }
.verdict { border-radius: 18px; background: #FFFBD2; color: #4F4000; padding: 14px 16px; line-height: 1.5; font-size: 15px; animation: monte .35s ease-out; }
.coach { display: flex; gap: 12px; align-items: flex-start; animation: monte .4s ease-out; }
.coach .av, .pense .av { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: "FatFrank", sans-serif; background: var(--jaune); color: #1D2124; }
.coach .bulle { padding: 12px 15px; line-height: 1.5; font-size: 15px; background: #fff; color: #1D2124; border-radius: 4px 20px 20px 20px; }
.coach .qui { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 3px; opacity: .7; }
.coach .points span { background: #086F70; }
.revele { display: flex; gap: 22px; align-items: center; animation: monte .5s ease-out; }
.revele .gros { font-family: "FatFrank", sans-serif; font-size: 84px; color: var(--jaune); line-height: 1; min-width: 170px; }
.revele p { color: #ddd; font-size: 17px; line-height: 1.5; }

.texte textarea { width: 100%; font: inherit; font-size: 16px; padding: 14px 16px; border-radius: 18px; border: 2px solid var(--fond); background: var(--fond2); color: var(--encre); resize: vertical; }
.texte .btn { justify-self: start; }
.envoye { margin: 0; padding: 14px 16px; border-left: 4px solid var(--aqua); background: var(--fond2); border-radius: 0 18px 18px 0; white-space: pre-wrap; }

.grille { display: grid; grid-template-columns: 340px 1fr; gap: 48px; margin-top: 34px; }
.cote { position: sticky; top: 24px; align-self: start; }
.surtitre { font-family: "FatFrank", sans-serif; font-size: 18px; color: var(--sarcelle); margin-top: 18px; }
.cote h1 { font-size: 56px; line-height: .98; margin-top: 6px; }
.cote .lead { margin-top: 16px; }
.principal { display: grid; gap: 22px; align-content: start; min-width: 0; }

.accueil { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; margin-top: 40px; }
.accueil > div { display: grid; gap: 22px; min-width: 0; }
.accueil h1 { font-size: 72px; line-height: .95; }
.promesse { display: grid; gap: 12px; }
.promesse div { display: flex; gap: 16px; align-items: center; background: var(--surface); border-radius: 22px; padding: 16px 20px; font-size: 18px; opacity: 0; animation: monte .5s ease-out forwards; }
.promesse div:nth-child(2) { animation-delay: .35s; } .promesse div:nth-child(3) { animation-delay: .7s; }
.ic { flex: none; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-family: "FatFrank", sans-serif; font-size: 18px; color: #1D2124; }
.ic.jaune { background: var(--jaune); } .ic.aqua { background: var(--aqua); } .ic.rose { background: var(--rose); }

.travail { display: grid; grid-template-columns: 1fr 380px; gap: 28px; margin-top: 34px; }
.travail > div:first-child { display: grid; gap: 18px; align-content: start; min-width: 0; }
.travail h1 { font-size: 52px; line-height: 1; }
.notes { display: grid; gap: 18px; align-content: start; }
.pense { display: flex; gap: 14px; align-items: center; }
.chrome { display: flex; gap: 14px; align-items: center; background: var(--sombre); color: var(--sombre-txt); border-radius: 22px; padding: 14px 18px; }
.chrome span { font-size: 14px; opacity: .8; }
.oeil { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--jaune); display: grid; place-items: center; position: relative; }
.oeil::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--jaune); animation: onde 1.8s infinite; }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.todo li { display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-radius: 18px; background: var(--surface-voile); color: var(--discret); }
.todo .st { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; background: var(--surface); border: 2px dashed #B3AFB6; }
.todo li.fait { background: var(--surface); color: var(--encre); } .todo li.fait .st { background: var(--sarcelle); border: 0; color: var(--fond); }
.todo li.en-cours { background: var(--sombre); color: var(--sombre-txt); } .todo li.en-cours .st { border: 3px solid var(--aqua); border-top-color: transparent; animation: tourne 1s linear infinite; }

.victoire { text-align: center; margin-top: 30px; position: relative; display: grid; gap: 14px; justify-items: center; }
.confettis { position: absolute; inset: -40px 0 auto; height: 360px; pointer-events: none; }
.confettis i { position: absolute; left: 50%; top: 150px; width: 14px; height: 14px; border-radius: 4px; opacity: 0; animation: eclat 1.4s cubic-bezier(.2,.8,.3,1) forwards; }
.badge { width: 150px; height: 150px; border-radius: 50%; background: var(--sarcelle); color: var(--fond); display: grid; place-items: center; font-size: 72px; box-shadow: 0 0 0 14px rgba(106,217,217,.45), 0 30px 60px -20px rgba(8,111,112,.6); animation: rebond .8s cubic-bezier(.2,1.6,.4,1); }
.victoire h1 { font-size: 60px; margin-top: 16px; }
.appris { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; width: 100%; max-width: 880px; margin-top: 18px; text-align: left; }
.appris .pill { justify-self: start; }
.barre { width: 100%; max-width: 880px; margin-top: 18px; background: var(--surface); border-radius: 26px; padding: 20px 26px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; text-align: left; }
.ensuite { font-size: 14px; color: var(--discret); } .ensuite b { display: block; font-family: "FatFrank", sans-serif; font-size: 20px; color: var(--encre); }
.piste { flex: 1; min-width: 120px; height: 14px; border-radius: 99px; background: var(--fond); overflow: hidden; }
.rempli { height: 100%; width: var(--a); border-radius: 99px; background: linear-gradient(90deg, var(--sarcelle), var(--aqua)); animation: remplit 1.6s cubic-bezier(.3,.9,.3,1); }

.fin { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 30px; }
.fin .tete { grid-column: 1 / -1; display: flex; align-items: center; gap: 30px; }
.fin .tete .illu { width: 200px; height: 200px; flex: none; margin: 0; }
.fin .tete h1 { font-size: 64px; line-height: .98; margin: 12px 0; }
.faits { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.faits div { background: var(--fond2); border-radius: 18px; padding: 12px 14px; }
.faits b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--sarcelle); margin-bottom: 3px; }
.semaine { display: flex; gap: 16px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--creme); color: var(--creme-txt); font-size: 15px; line-height: 1.45; }
.cal { flex: none; width: 52px; height: 56px; border-radius: 12px; background: #fff; color: #1D2124; display: grid; place-items: center; font-family: "FatFrank", sans-serif; font-size: 22px; box-shadow: 0 4px 0 var(--jaune); }
.score { display: flex; align-items: baseline; gap: 10px; } .score .nb { font-family: "FatFrank", sans-serif; font-size: 54px; color: var(--sarcelle); }
.concepts { display: flex; flex-wrap: wrap; gap: 8px; }
.concepts span { font-size: 14px; padding: 8px 12px; border-radius: 999px; background: var(--fond2); color: var(--sarcelle-f); }
.concepts span::before { content: "✓ "; font-weight: 700; }
.concepts span.rev { background: var(--creme); color: var(--creme-txt); } .concepts span.rev::before { content: "↻ "; }
.sombre { background: var(--sombre); color: var(--sombre-txt); grid-column: 1 / -1; }
.resume pre { margin: 0; white-space: pre-wrap; font-family: inherit; font-size: 15px; line-height: 1.55; color: #ddd; max-height: 320px; overflow: auto; }
.resume .btn { justify-self: start; }
.fin-cartes { grid-column: 1 / -1; display: grid; gap: 18px; }

.attente { display: grid; gap: 16px; justify-items: center; text-align: center; margin-top: 12vh; }

<div class="decor" aria-hidden="true"><div class="orbe"></div><div class="orbe2"></div></div>
<main id="ecran" aria-live="polite"></main>
<div id="alerte" class="alerte" role="alert" hidden><p id="alerte-texte"></p><button id="alerte-bouton" hidden></button></div>

<script>
// Rendu de l'écran du coach : fonctions pures, de l'écran (document coach/ecran) et des réponses
// vers le HTML de la zone principale. Ce fichier est aussi inséré tel quel dans la page à la
// construction (scripts/construire-page.mjs retire les `export`) : aucun import, aucune dépendance.

const NOMS_ETAPES = [
  'Installation', 'Porte d\'entrée', 'Décrire', 'Ça vaut le coup ?', 'Découper',
  'Choisir la forme', 'Construire', 'Tester', 'La fiche',
];

// Illustration de chaque étape (classes CSS du gabarit, images incluses à la construction).
const ILLUSTRATIONS = [
  'implementation', 'formation', 'analyse', 'analyse', 'migration',
  'implementation', 'migration', 'implementation', 'formation',
];

const LETTRES = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

const STATUTS = {
  'premier-coup': '✓ Du premier coup',
  'deuxieme-essai': '✓ Au deuxième essai',
  'a-revoir': '↻ À revoir',
};

const POINTS = '<span class="points" aria-hidden="true"><span></span><span></span><span></span></span>';

// Échappe tout texte venu du coach ; le tiret long, interdit partout, devient une virgule.
function echapper(texte) {
  return String(texte ?? '')
    .replace(/\s*\u2014\s*/g, ', ')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function cleReponse(ecran, carteId) {
  return `${ecran.n}-${carteId}`;
}

function reponseDe(ecran, reponses, carteId) {
  return (reponses || {})[cleReponse(ecran, carteId)] || null;
}

function cartesDe(ecran) {
  return Array.isArray(ecran.cartes) ? ecran.cartes : [];
}

function toutesRepondues(ecran, reponses) {
  return cartesDe(ecran).every((c) => reponseDe(ecran, reponses, c.id));
}

function contientQuiz(ecran) {
  return cartesDe(ecran).some((c) => c.type === 'quiz');
}

function bandeauFait(ecran, reponses) {
  return Boolean(ecran.bandeau && reponseDe(ecran, reponses, `bandeau-${ecran.bandeau.id}`));
}

// La page sonne le coach une fois par écran (Continuer, bandeau, ou dernière carte d'un écran
// sans quiz), et en plus sur un quiz raté dont le mot du coach n'est pas encore écrit.
function doitSonner(ecran, reponses, evenement) {
  if (!ecran || !evenement) return false;
  if (evenement.type === 'continuer' || evenement.type === 'bandeau') return true;
  if (evenement.type !== 'carte') return false;
  const carte = cartesDe(ecran).find((c) => c.id === evenement.carte);
  if (!carte) return false;
  if (carte.type === 'quiz') {
    return evenement.juste === false && ecran.type !== 'accueil' && !carte.motCoach;
  }
  return toutesRepondues(ecran, reponses) && !contientQuiz(ecran);
}

function etapeDe(ecran) {
  const e = Number(ecran.parcours && ecran.parcours.etape);
  return Number.isInteger(e) && e >= 0 && e <= 8 ? e : 0;
}

function illustration(nom) {
  return `<div class="illu illu-${nom}" aria-hidden="true"></div>`;
}

function haut(ecran) {
  const titre = ecran && ecran.parcours && ecran.parcours.titre;
  const parc = titre
    ? `Ton parcours : <b>${echapper(titre)}</b>`
    : 'Coach d\'automatisation';
  return `<header class="haut"><span class="logo" role="img" aria-label="Tooly"></span><div class="parc">${parc}</div></header>`;
}

function etapes(ecran) {
  const cur = etapeDe(ecran);
  const items = NOMS_ETAPES.map((nom, i) => {
    const etat = i < cur ? 'done' : i === cur ? 'cur' : 'todo';
    const marque = i < cur ? '✓' : String(i);
    const courant = i === cur ? ' aria-current="step"' : '';
    return `<li class="${etat}"${courant}><span class="n">${marque}</span><span class="lbl">${echapper(nom)}</span></li>`;
  }).join('');
  return `<ol class="etapes" aria-label="Progression">${items}</ol>`;
}

function verdictQuiz(carte, juste) {
  return juste
    ? `<div class="verdict"><b>Exactement.</b> ${echapper(carte.expliqueBonne)}</div>`
    : `<div class="verdict"><b>Pas tout à fait.</b> ${echapper(carte.expliqueFausse)}</div>`;
}

function motDuCoach(carte) {
  const contenu = carte.motCoach
    ? echapper(carte.motCoach)
    : `${POINTS}<span class="sr">Le coach écrit</span>`;
  return `<div class="coach" aria-live="polite"><div class="av">C</div><div class="bulle"><div class="qui">Le coach</div><div class="txt">${contenu}</div></div></div>`;
}

function carteQuiz(ecran, carte, rep) {
  const repondu = Boolean(rep);
  const options = (carte.options || []).map((o, i) => {
    const classes = ['opt'];
    if (repondu && o.bonne) classes.push('bonne');
    if (repondu && rep.choix === i && !o.bonne) classes.push('fausse');
    const off = repondu ? ' disabled' : '';
    return `<button class="${classes.join(' ')}" data-carte="${echapper(carte.id)}" data-index="${i}"${off}><span class="k">${LETTRES[i] || i + 1}</span><span>${echapper(o.texte)}</span></button>`;
  }).join('');
  const accueil = ecran.type === 'accueil';
  const tag = accueil ? 'Petit défi' : 'Carte · Vérifie que tu as compris';
  let suite = '';
  if (repondu && accueil) {
    const bonne = (carte.options || []).find((o) => o.bonne);
    const nombre = parseInt(bonne ? bonne.texte : '', 10) || 0;
    suite = `<div class="revele"><div class="gros" data-compteur="${nombre}">${nombre} h</div><p>${echapper(carte.expliqueBonne)}</p></div>`;
  } else if (repondu) {
    suite = verdictQuiz(carte, rep.juste === true);
    if (rep.juste === false) suite += motDuCoach(carte);
  }
  return `<section class="carte quiz${repondu ? ' fini' : ''}"><span class="tag">${tag}</span><h2>${echapper(carte.question)}</h2><div class="opts">${options}</div>${suite}</section>`;
}

function carteChoix(ecran, carte, rep) {
  const repondu = Boolean(rep);
  const options = (carte.options || []).map((o, i) => {
    const classes = ['opt'];
    if (repondu && rep.choix === i) classes.push('choisie');
    const off = repondu ? ' disabled' : '';
    const reco = i === 0 ? '<span class="reco">Recommandé</span>' : '';
    return `<button class="${classes.join(' ')}" data-carte="${echapper(carte.id)}" data-index="${i}"${off}><span class="k">${LETTRES[i] || i + 1}</span><span>${echapper(o.texte)}</span>${reco}</button>`;
  }).join('');
  return `<section class="carte choix${repondu ? ' fini' : ''}"><span class="tag clair">À toi de choisir</span><h2>${echapper(carte.question)}</h2><div class="opts">${options}</div></section>`;
}

function carteTexte(ecran, carte, rep) {
  const id = echapper(carte.id);
  const corps = rep
    ? `<blockquote class="envoye">${echapper(rep.texte)}</blockquote><p class="sub">Envoyé au coach.</p>`
    : `<textarea id="texte-${id}" data-carte="${id}" rows="4" placeholder="Écris ici, comme tu parlerais à un collègue."></textarea><button class="btn main" data-action="envoyer" data-carte="${id}">Envoyer</button>`;
  return `<section class="carte texte"><span class="tag clair">À toi d'écrire</span><h2><label for="texte-${id}">${echapper(carte.question)}</label></h2>${corps}</section>`;
}

function carte(ecran, c, reponses) {
  const rep = reponseDe(ecran, reponses, c.id);
  if (c.type === 'quiz') return carteQuiz(ecran, c, rep);
  if (c.type === 'texte') return carteTexte(ecran, c, rep);
  return carteChoix(ecran, c, rep);
}

function cartes(ecran, reponses) {
  return cartesDe(ecran).map((c) => carte(ecran, c, reponses)).join('');
}

function attenteCoach() {
  return `<div class="reflechit" aria-live="polite">${POINTS}<span>Le coach prépare la suite.</span></div>`;
}

function boutonContinuer(libelle) {
  return `<div class="suite"><button class="btn main" data-action="continuer">${libelle}</button></div>`;
}

// Bas de la zone principale : Continuer, ou l'attente du coach une fois qu'on l'a sonné.
function suite(ecran, reponses) {
  const continue_ = Boolean(reponseDe(ecran, reponses, 'continuer'));
  const nb = cartesDe(ecran).length;
  const toutes = toutesRepondues(ecran, reponses);
  if (continue_ || bandeauFait(ecran, reponses) || (nb > 0 && toutes && !contientQuiz(ecran))) {
    return attenteCoach();
  }
  if (ecran.bandeau) return '';
  if (nb === 0 || toutes) return boutonContinuer('Continuer →');
  return '';
}

function bandeau(ecran, reponses) {
  const b = ecran.bandeau;
  if (!b || bandeauFait(ecran, reponses)) return '';
  const aTaper = b.aTaper
    ? `<span class="a-taper"><code>${echapper(b.aTaper)}</code><button class="copier" data-action="copier" data-texte="${echapper(b.aTaper)}">Copier</button></span>`
    : '';
  return `<div class="bandeau" role="region" aria-label="À faire dans Claude Code"><div class="ico" aria-hidden="true">&gt;_</div><p>${echapper(b.texte)} ${aTaper}</p><button class="ok" data-action="bandeau" data-bandeau="${echapper(b.id)}">C'est fait</button></div>`;
}

function pourTaTache(ecran) {
  const p = ecran.pourTaTache;
  if (!p || !Array.isArray(p.lignes) || p.lignes.length === 0) return '';
  const lignes = p.lignes.map((l) => `<div><b>${echapper(l.label)}</b><span>${echapper(l.valeur)}</span></div>`).join('');
  const verdict = p.verdict ? `<span class="verdict-tache">✓ ${echapper(p.verdict)}</span>` : '';
  return `<section class="carte"><h2>Pour ta tâche</h2><div class="sub">D'après ce que tu m'as décrit</div><div class="crit">${lignes}</div>${verdict}</section>`;
}

function enveloppe(ecran, type, corps, reponses) {
  return `<div class="ecran ecran-${type}" data-ecran="${type}" data-n="${Number(ecran.n) || 0}">${corps}${bandeau(ecran, reponses)}</div>`;
}

function rendreAttente() {
  const corps = `${haut(null)}<div class="attente">${illustration('formation')}<h1>Le coach prépare ton écran</h1><p class="lead">${POINTS}</p><p class="lead">Garde cette page ouverte : elle se met à jour toute seule.</p></div>`;
  return `<div class="ecran ecran-attente" data-ecran="attente" data-n="0">${corps}</div>`;
}

function rendreAccueil(ecran, reponses) {
  const fini = toutesRepondues(ecran, reponses) && cartesDe(ecran).length > 0;
  const promesse = fini
    ? `<div class="promesse"><div><span class="ic jaune">1</span>Aujourd'hui, on en récupère une.</div><div><span class="ic aqua">2</span>Je construis, toi tu comprends pourquoi.</div><div><span class="ic rose">3</span>Tu repars avec l'outil et le savoir-faire.</div></div>`
    : '';
  const bas = fini ? (reponseDe(ecran, reponses, 'continuer') ? attenteCoach() : boutonContinuer('On commence →')) : '';
  const corps = `${haut(ecran)}<div class="accueil"><div><h1>${echapper(ecran.titre)}</h1><p class="lead">${echapper(ecran.explication)}</p>${cartes(ecran, reponses)}${promesse}${bas}</div>${illustration('formation')}</div>`;
  return enveloppe(ecran, 'accueil', corps, reponses);
}

function rendreEtape(ecran, reponses) {
  const e = etapeDe(ecran);
  const cote = `<aside class="cote">${illustration(ILLUSTRATIONS[e])}<div class="surtitre">Étape ${e} sur 8 · ${echapper(NOMS_ETAPES[e])}</div><h1>${echapper(ecran.titre)}</h1><p class="lead">${echapper(ecran.explication)}</p></aside>`;
  const principal = `<div class="principal">${pourTaTache(ecran)}${cartes(ecran, reponses)}${suite(ecran, reponses)}</div>`;
  return enveloppe(ecran, 'etape', `${haut(ecran)}${etapes(ecran)}<div class="grille">${cote}${principal}</div>`, reponses);
}

function rendreTravail(ecran, reponses) {
  const e = etapeDe(ecran);
  const chrome = e === 6
    ? '<div class="chrome"><div class="oeil" aria-hidden="true">👀</div><div><b>Ouvre ton onglet Chrome.</b><br><span>Je n\'y tape jamais de mot de passe. Si on t\'en demande un, c\'est toi qui le tapes.</span></div></div>'
    : '';
  const lignes = (ecran.travail || []).map((l) => {
    const etat = ['fait', 'en-cours', 'a-faire'].includes(l.etat) ? l.etat : 'a-faire';
    const marque = etat === 'fait' ? '✓' : '';
    return `<li class="${etat}"><span class="st" aria-hidden="true">${marque}</span>${echapper(l.texte)}</li>`;
  }).join('');
  const notes = ((ecran.pourTaTache && ecran.pourTaTache.lignes) || []).map((l, i) => {
    const entete = i === 0
      ? `<div class="pense"><div class="av">C</div><div><b>Le coach</b><br>${POINTS}</div></div>`
      : '<span class="pill">Tu te souviens ?</span>';
    return `<section class="carte">${entete}<h3>${echapper(l.label)}</h3><p>${echapper(l.valeur)}</p></section>`;
  }).join('');
  const gauche = `<div><span class="tag">Étape ${e} · ${echapper(NOMS_ETAPES[e])}</span><h1>${echapper(ecran.titre)}</h1><p class="lead">${echapper(ecran.explication)}</p>${chrome}<ol class="todo">${lignes}</ol>${cartes(ecran, reponses)}${cartesDe(ecran).length ? suite(ecran, reponses) : ''}</div>`;
  return enveloppe(ecran, 'travail', `${haut(ecran)}${etapes(ecran)}<div class="travail">${gauche}<div class="notes">${notes}</div></div>`, reponses);
}

function rendreValidee(ecran, reponses) {
  const e = etapeDe(ecran);
  const v = ecran.validee || { concepts: [], suivante: null };
  const appris = (v.concepts || []).map((c) => {
    const statut = STATUTS[c.statut] ? c.statut : 'premier-coup';
    return `<section class="carte"><span class="pill ${statut}">${STATUTS[statut]}</span><h3>${echapper(c.nom)}</h3><p>${echapper(c.definition)}</p></section>`;
  }).join('');
  const de = Math.round((e / 9) * 100);
  const a = Math.round(((e + 1) / 9) * 100);
  const suivante = v.suivante
    ? `<div class="ensuite">Ensuite<b>Étape ${Math.min(e + 1, 8)} · ${echapper(v.suivante)}</b></div>`
    : '';
  const bouton = reponseDe(ecran, reponses, 'continuer') ? attenteCoach() : '<button class="btn main" data-action="continuer">Continuer →</button>';
  const corps = `${haut(ecran)}<div class="victoire"><div class="confettis" aria-hidden="true"></div><div class="badge" aria-hidden="true">✓</div><h1>${echapper(ecran.titre)}</h1><p class="lead">${echapper(ecran.explication)}</p><div class="appris">${appris}</div><div class="barre">${suivante}<div class="piste"><div class="rempli" style="--de:${de}%;--a:${a}%"></div></div>${bouton}</div></div>`;
  return enveloppe(ecran, 'validee', corps, reponses);
}

function rendreFin(ecran, reponses) {
  const f = ecran.fin || { construit: null, concepts: [], resume: '' };
  const construit = Array.isArray(f.construit)
    ? `<section class="carte"><h2>Ce que tu as construit</h2><div class="faits">${f.construit.map((l) => `<div><b>${echapper(l.label)}</b>${echapper(l.valeur)}</div>`).join('')}</div><div class="semaine"><div class="cal">+7</div><div><b>Rendez-vous dans 7 jours.</b> Relance le coach et dis-moi si ça a bien marché : c'est ce qui fait compter ton automatisation.</div></div></section>`
    : '';
  const concepts = f.concepts || [];
  const acquis = concepts.filter((c) => c.statut !== 'a-revoir').length;
  const liste = concepts.map((c) => `<span${c.statut === 'a-revoir' ? ' class="rev"' : ''}>${echapper(c.nom)}</span>`).join('');
  const appris = `<section class="carte"><h2>Ce que tu as appris</h2><div class="score"><span class="nb">${acquis}</span><span>concepts sur ${concepts.length} acquis</span></div><div class="concepts">${liste}</div></section>`;
  const resume = f.resume
    ? `<section class="carte sombre resume"><h2>Le résumé pour Mario</h2><pre>${echapper(f.resume)}</pre><button class="btn jaune" data-action="copier" data-texte="${echapper(f.resume)}">Copier le résumé</button></section>`
    : '';
  const corps = `${haut(ecran)}<div class="fin"><div class="tete">${illustration('implementation')}<div><span class="tag">Parcours terminé</span><h1>${echapper(ecran.titre)}</h1><p class="lead">${echapper(ecran.explication)}</p></div></div>${construit}${appris}${resume}<div class="fin-cartes">${cartes(ecran, reponses)}${cartesDe(ecran).length ? suite(ecran, reponses) : ''}</div></div>`;
  return enveloppe(ecran, 'fin', corps, reponses);
}

const RENDUS = {
  accueil: rendreAccueil,
  etape: rendreEtape,
  travail: rendreTravail,
  validee: rendreValidee,
  fin: rendreFin,
};

function rendreEcran(ecran, reponses) {
  const rendu = ecran && RENDUS[ecran.type];
  if (!rendu) return rendreAttente();
  return rendu(ecran, reponses || {});
}


// Page du coach : affiche l'écran que le coach écrit dans la base (coach/ecran), écrit les
// réponses de l'employé (reponses/<n>-<carte>), et sonne le coach par un commentaire.
(() => {
  const DELAI_SILENCE = 300000;
  const PLAN_B = 'La page ne peut pas joindre le coach. Va dans la fenêtre de Claude Code et écris terminal : il continue avec toi là-bas.';
  const SILENCE = 'Le coach ne répond pas. Va dans la fenêtre de Claude Code et écris terminal.';
  const ACCORD = 'claude.ai doit d\'abord te demander ton accord pour que la page écrive au coach. Accepte, puis clique sur Prévenir le coach.';

  const zone = document.getElementById('ecran');
  const boiteAlerte = document.getElementById('alerte');
  const texteAlerte = document.getElementById('alerte-texte');
  const boutonAlerte = document.getElementById('alerte-bouton');

  let ecran = null;
  let reponses = {};
  let nAffiche = -1;
  let dernierHtml = '';
  let nAnime = null;
  let db = null;
  let comments = null;
  let threadId = null;
  let minuterie = null;

  let actionAlerte = null;
  function alerte(texte, bouton, action) {
    texteAlerte.textContent = texte;
    boutonAlerte.hidden = !bouton;
    if (bouton) boutonAlerte.textContent = bouton;
    actionAlerte = action || sonner;
    boiteAlerte.hidden = false;
  }
  function cacherAlerte() { boiteAlerte.hidden = true; }

  function dessiner() {
    const html = rendreEcran(ecran, reponses);
    if (html === dernierHtml) return;
    const saisies = {};
    zone.querySelectorAll('textarea[id]').forEach((t) => { saisies[t.id] = t.value; });
    const focus = document.activeElement && document.activeElement.id;
    dernierHtml = html;
    zone.innerHTML = html;
    zone.querySelectorAll('textarea[id]').forEach((t) => { if (saisies[t.id]) t.value = saisies[t.id]; });
    if (focus && document.getElementById(focus)) document.getElementById(focus).focus();
    animer();
  }

  // Les animations d'entrée ne jouent qu'au premier dessin d'un écran.
  function animer() {
    const racine = zone.querySelector('.ecran');
    if (!racine) return;
    const n = racine.dataset.n;
    if (nAnime === n) { racine.classList.add('deja'); return; }
    nAnime = n;
    const reduit = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const confettis = racine.querySelector('.confettis');
    if (confettis && !reduit) {
      const couleurs = ['#FFE924', '#6AD9D9', '#FF80EF', '#086F70', '#FF9082'];
      for (let i = 0; i < 46; i++) {
        const el = document.createElement('i');
        const a = Math.random() * Math.PI * 2;
        const d = 160 + Math.random() * 320;
        el.style.background = couleurs[i % couleurs.length];
        el.style.setProperty('--x', `${Math.cos(a) * d}px`);
        el.style.setProperty('--y', `${Math.sin(a) * d * 0.6 - 60}px`);
        el.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);
        el.style.animationDelay = `${Math.random() * 0.2}s`;
        if (i % 3 === 0) el.style.borderRadius = '50%';
        confettis.appendChild(el);
      }
    }
  }

  // Le compteur du défi monte une seule fois, au moment de la réponse.
  function compter() {
    const gros = zone.querySelector('.gros[data-compteur]');
    if (!gros || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cible = Number(gros.dataset.compteur) || 0;
    let n = 0;
    gros.textContent = '0 h';
    const t = setInterval(() => {
      n += 1;
      if (!gros.isConnected) { clearInterval(t); return; }
      gros.textContent = `${n} h`;
      if (n >= cible) clearInterval(t);
    }, 28);
  }

  function armerSilence() {
    clearTimeout(minuterie);
    minuterie = setTimeout(() => alerte(SILENCE, 'Prévenir le coach'), DELAI_SILENCE);
  }

  async function sonner() {
    if (!comments) { alerte(PLAN_B); return; }
    let etat = 'erreur';
    try { etat = await comments.canSendToClaude(); } catch (e) { etat = 'erreur'; }
    if (etat !== 'available') { alerte(PLAN_B, 'Réessayer'); return; }
    const text = `Réponse de l'écran ${nAffiche}`;
    try {
      const cible = threadId
        ? { threadId, text }
        : { anchor: await comments.anchorFor(zone.querySelector('.ecran') || zone), text };
      const r = await comments.sendToClaude(cible);
      if (r.threadId !== threadId) {
        threadId = r.threadId;
        if (db) db.doc('page/fil').set({ threadId }).catch(() => {});
      }
      cacherAlerte();
      armerSilence();
    } catch (e) {
      const code = e && e.code;
      if (code === 'not_found' && threadId) { threadId = null; alerte('Le fil du coach a changé. Clique pour le prévenir à nouveau.', 'Prévenir le coach'); return; }
      if (code === 'consent_required') { alerte(ACCORD, 'Prévenir le coach'); return; }
      if (code === 'rate_limited' || code === 'unavailable') { alerte('Un instant : attends quelques secondes, puis préviens le coach.', 'Prévenir le coach'); return; }
      alerte(PLAN_B, 'Réessayer');
    }
  }

  function ecrire(id, donnees) {
    const corps = { ...donnees, ecran: nAffiche, le: new Date().toISOString() };
    reponses = { ...reponses, [id]: corps };
    dessiner();
    if (!db) return Promise.resolve();
    return db.doc(`reponses/${id}`).set(corps).catch(() => alerte(PLAN_B, 'Réessayer'));
  }

  // Écrit la réponse et sonne dans le même geste : l'envoi au coach exige un clic récent.
  async function repondre(id, donnees, evenement) {
    const ecriture = ecrire(id, donnees);
    const faut = doitSonner(ecran, reponses, evenement);
    if (faut) await sonner();
    await ecriture;
  }

  async function copier(bouton) {
    const texte = bouton.dataset.texte || '';
    try {
      await navigator.clipboard.writeText(texte);
      bouton.textContent = 'Copié';
    } catch (e) {
      const zoneCopie = document.createElement('textarea');
      zoneCopie.value = texte;
      bouton.after(zoneCopie);
      zoneCopie.select();
      bouton.textContent = 'Sélectionné : Ctrl+C';
    }
  }

  zone.addEventListener('click', (ev) => {
    const cible = ev.target.closest('button');
    if (!cible || cible.disabled || !ecran) return;
    const n = nAffiche;
    if (cible.dataset.carte && cible.dataset.index !== undefined) {
      const carte = (ecran.cartes || []).find((c) => c.id === cible.dataset.carte);
      if (!carte) return;
      const choix = Number(cible.dataset.index);
      const juste = carte.type === 'quiz' ? Boolean(carte.options[choix] && carte.options[choix].bonne) : null;
      repondre(`${n}-${carte.id}`, { carte: carte.id, choix, texte: null, juste }, { type: 'carte', carte: carte.id, juste });
      if (ecran.type === 'accueil') requestAnimationFrame(compter);
      return;
    }
    const action = cible.dataset.action;
    if (action === 'envoyer') {
      const champ = document.getElementById(`texte-${cible.dataset.carte}`);
      const texte = champ ? champ.value.trim() : '';
      if (!texte) { if (champ) champ.focus(); return; }
      repondre(`${n}-${cible.dataset.carte}`, { carte: cible.dataset.carte, choix: null, texte, juste: null }, { type: 'carte', carte: cible.dataset.carte });
    } else if (action === 'continuer') {
      repondre(`${n}-continuer`, { continuer: true }, { type: 'continuer' });
    } else if (action === 'bandeau') {
      repondre(`${n}-bandeau-${cible.dataset.bandeau}`, { bandeau: cible.dataset.bandeau, fait: true }, { type: 'bandeau' });
    } else if (action === 'copier') {
      copier(cible);
    }
  });

  boutonAlerte.addEventListener('click', () => { cacherAlerte(); if (actionAlerte) actionAlerte(); });

  // Au chargement, on vérifie seulement que le coach écoute ; on ne le sonne pas.
  async function verifierEcoute() {
    let etat = 'off';
    try { etat = comments ? await comments.canSendToClaude() : 'off'; } catch (e) { etat = 'off'; }
    if (etat === 'available') cacherAlerte();
    else alerte(PLAN_B, 'Vérifier à nouveau', verifierEcoute);
  }

  async function demarrer() {
    dessiner();
    if (!window.claude || typeof window.claude.use !== 'function') { alerte(PLAN_B); return; }
    db = await window.claude.use('db');
    if (!db) { alerte(PLAN_B); return; }
    comments = await window.claude.use('comments');
    db.doc('page/presence').set({ ouverteLe: new Date().toISOString() }).catch(() => {});
    try {
      const fil = await db.doc('page/fil').get();
      if (fil.exists && fil.data().threadId) threadId = fil.data().threadId;
    } catch (e) { /* pas de fil connu : le premier envoi en créera un */ }
    db.doc('coach/ecran').onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : null;
      if (!d) return;
      const n = Number(d.n) || 0;
      if (n < nAffiche) return;
      clearTimeout(minuterie);
      cacherAlerte();
      nAffiche = n;
      ecran = d;
      dessiner();
    }, () => alerte(PLAN_B));
    db.collection('reponses').onSnapshot((qs) => {
      const lues = {};
      qs.docs.forEach((doc) => { lues[doc.id] = doc.data(); });
      reponses = { ...reponses, ...lues };
      dessiner();
    }, () => {});
    await verifierEcoute();
  }

  demarrer();
})();
</script>
